name: Impulse Graph Tooling CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-tooling-suite:
    name: Build & Test Tooling Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Core Repository
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-core
          path: impulse-graph-core

      - name: Checkout Tooling Repository
        uses: actions/checkout@v4
        with:
          path: impulse-graph-tooling

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test Tooling Suite
        shell: bash
        run: |
          cd impulse-graph-tooling
          cargo build --release
          cargo test --verbose

  ci-gate:
    name: CI Gate / All Checks Passed
    needs: [build-tooling-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Required CI Checks
        run: |
          echo "Checking status of all upstream CI dependencies..."
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ CI Gate Failed: One or more upstream test or build jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ CI Gate Passed: All upstream checks passed or were safely skipped by path filters."
