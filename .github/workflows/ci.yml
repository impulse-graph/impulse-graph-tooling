name: Impulse Graph Tooling CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-tooling-suite:
    name: Build & Test Tooling Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Core Repository
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-core
          path: impulse-graph-core

      - name: Checkout Tooling Repository
        uses: actions/checkout@v4
        with:
          path: impulse-graph-tooling

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test Tooling Suite
        run: |
          cd impulse-graph-tooling
          cargo build --release
          cargo test --verbose
