name: Impulse Graph Tooling CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-tooling-suite:
    name: Build & Test Tooling Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout impulse-graph-tooling
        uses: actions/checkout@v4

      - name: Checkout impulse-graph-core (if PAT available)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-core
          path: impulse-graph-core
          ref: main
          token: ${{ secrets.ORGANIZATION_PAT }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Core Static Kernel (if checked out)
        run: |
          if [ -d impulse-graph-core/impulse-cpp ]; then
            cmake -B impulse-graph-core/impulse-cpp/build -S impulse-graph-core/impulse-cpp \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF
            cmake --build impulse-graph-core/impulse-cpp/build --config Release
          fi

      - name: Cargo Build & Test Tooling Suite
        run: |
          cargo build --release
          if [ -d impulse-graph-core ]; then
            cargo test --verbose
          fi
