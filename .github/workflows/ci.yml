name: Impulse Graph Tooling CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-tooling-suite:
    name: Build & Test Tooling Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout impulse-graph-tooling
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Provision Core Stub
        run: |
          if [ ! -f ../impulse-graph-core/impulse-rust/Cargo.toml ] && [ ! -f impulse-graph-core/impulse-rust/Cargo.toml ]; then
            mkdir -p ../impulse-graph-core/impulse-rust/src
            cat << 'EOF' > ../impulse-graph-core/impulse-rust/Cargo.toml
[package]
name = "impulse-graph"
version = "0.9.0"
edition = "2021"

[lib]
name = "impulse_graph"
path = "src/lib.rs"
EOF
            touch ../impulse-graph-core/impulse-rust/src/lib.rs
          fi

      - name: Cargo Build & Test Tooling Suite
        run: |
          cargo build --release
          if [ -d impulse-graph-core/impulse-cpp/build ]; then
            cargo test --verbose
          fi
